<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Palitóteles — conectar TikTok</title><style>body{font-family:Georgia,serif;max-width:640px;margin:60px auto;padding:0 20px;color:#111;background:#fff;line-height:1.6}
code{display:block;word-break:break-all;background:#f3f3f3;padding:12px;border:1px solid #111;font-size:14px}button{margin-top:12px;padding:10px 18px;background:#111;color:#fff;border:0;font-size:16px;cursor:pointer}</style></head>
<body><h1>Conectar o TikTok</h1><div id="out"></div>
<script>
var p=new URLSearchParams(location.search),c=p.get("code"),o=document.getElementById("out");
if(c){o.innerHTML='<p>Autorização recebida. Copie o código abaixo e cole no atalho do Palitóteles:</p><code id="c"></code><button onclick="navigator.clipboard.writeText(document.getElementById(\'c\').textContent);this.textContent=\'Copiado!\'">Copiar código</button>';document.getElementById("c").textContent=c;}
else if(p.get("error")){o.textContent="O TikTok não autorizou: "+(p.get("error_description")||p.get("error"));}
else{o.textContent="Esta página recebe a autorização do TikTok para o app privado do Palitóteles.";}
</script></body></html>
